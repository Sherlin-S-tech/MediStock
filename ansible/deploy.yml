---
- name: Deploy medicine stock application
  hosts: medicine_hosts
  become: false
  tasks:
    - name: Check Docker engine is available
      community.docker.docker_host_info:
      register: docker_info
    - name: Ensure persistent named volume exists
      community.docker.docker_volume:
        name: "{{ app_volume }}"
        state: present
    - name: Deploy requested application image
      community.docker.docker_container:
        name: "{{ app_name }}"
        image: "{{ app_image }}"
        pull: false
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ app_port }}:5000"
        volumes:
          - "{{ app_volume }}:/app/data"
        env:
          SECRET_KEY: "{{ lookup('env', 'MEDICINE_STOCK_SECRET_KEY') | default('local-demo-change-this-secret', true) }}"
          DATABASE_PATH: /app/data/medicines.db
          NEAR_EXPIRY_DAYS: "30"
          SEED_DEMO_DATA: "true"
        healthcheck:
          test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
          interval: 30s
          timeout: 5s
          retries: 3
          start_period: 10s
    - name: Wait for application health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
